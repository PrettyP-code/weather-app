    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Weather APP</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="./style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"> 
        <!-- //fontawsome link -->
    </head>
    <body>
        <div class="bg-dark">
            <div class="container min-vh-100 d-flex align-items-center justify-content-center">
                <div class="card shadow-lg border-0 weather-card">
                    <div class="card-body p-4">
                        <div class="input-group mb-5">
                            <input type="text" name="cityName" id="cityNameInput" class="form-control form-control-lg border-0 shadow-sm"  placeholder="Enter city name">
                            <button class="btn btn-light shadow-sm" id="searchBtn" onclick= "getWeatherData()">
                            <i class="fa-solid fa-magnifying-glass"></i> 
                            <!--  font awsome icon -->
                            </button>
                        </div>
                        <div id="loading" class="text-center text-secondary d-none text-white">
                            <div class="spinner-border" role=""status>
                                <span class="visually-hidden">Loading....</span>
                            </div>   
                        </div>
                        
                            <div id="error" class="alert alert-danger d-none" role="alert" ></div>
                            <div id="weatherContent" class="d-none">
                                <div class="text-center mb-4 text-white">
                                    <i id="weatherIcon" class="fa-solid fa-cloud-sun weather-icon"></i>
                                </div>
                            

                        <div class="text-center mb-2">
                            <h1 id="temperature" class="display-1 fw-bold text-white mb-0">--°C</h1>
                        </div>
                        <div class="text-center mb-2">
                            <h2 id="cityName" class="fs-1 text-white fw-light">
                                --
                            </h2>
                            <p id="description" class="text-white-50 text-capitalize mb-0"></p>
                        </div>
                        <div class="row text-white mt-4">
                            <div class="col-6 text-center border-end border-white">
                                <i class="fa-solid fa-droplet fs-3 mb-2"></i>
                                <h3 id="humidity" class="fs-2 fw-bold mb-1">--%</h3>
                                <p class="mb-0 text-center text-white-50">Humidity</p>
                            </div>
                            <div class="col-6 text-center ">
                                <i class="fa-solid fa-wind fs-3 mb-2"></i>
                                <h3 id="windSpeed" class="fs-2 fw-bold mb-1">--km/h</h3>
                                <p class="mb-0 text-center text-white-50">Wind Speed</p>
                            </div>
                        </div>

                        </div>

                    </div>
                </div>
            </div>
        </div>


        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="./scripts.js"></script>
    </body>
    </html>
